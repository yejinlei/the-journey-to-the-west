# 部署 GitHub Pages：从 06_Web前端/ 静态站点
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '06_Web前端/**'
      - '.github/workflows/deploy.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/setup-pages@v3

      - name: Upload Web Frontend
        uses: actions/upload-pages-artifact@v3
        with:
          path: 06_Web前端

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
